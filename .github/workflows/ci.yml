name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js v22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Compile Compact contract
      #    Gracefully skips when the Midnight compact compiler is not
      #    available in the CI environment (standard GitHub-hosted runners).
      #    In a full Midnight DevNet environment this runs:
      #      compact compile contracts/counter.compact
      - name: Compile Compact contract
        run: |
          if command -v compact &> /dev/null; then
            compact compile contracts/counter.compact
          else
            echo "compact compiler not found — skipping compile step (demo mode)"
          fi

      # 5. Run test suite (must pass — 15 tests across 3 suites)
      - name: Run tests
        run: npm test

      # 6. Build production bundle (must succeed with zero errors)
      - name: Build production bundle
        run: npm run build
